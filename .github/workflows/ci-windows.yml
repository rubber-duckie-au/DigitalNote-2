name: CI - Windows x64

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (leave empty / blank choice to use the branch from 'Use workflow from' above)"
        required: false
        type: choice
        options:
          - ""
          - master
          - 2.0.0.7-testing
          - 2.0.0.8-testing
          - 2.0.0.9-testing
        default: ""
      builder_repo:
        description: "Builder repo URL (blank = repo variable, else production)"
        required: false
        type: string
        default: ""
  workflow_call:      # called by release.yml on tag push
    inputs:
      branch:
        description: "Branch / ref to build (passed by release.yml)"
        required: false
        type: string
        default: ""

env:
  # v2.0.0.9: Builder repo is a VARIABLE, not hardcoded at each clone.
  #
  # Previously every clone used the literal URL -- even in the workflows
  # that already declared BUILDER_REPO -- so the variable existed but did
  # nothing, and pointing a test run at a fork meant editing several lines
  # in several files.
  #
  # Resolution order:
  #   1. the builder_repo workflow_dispatch input, if supplied
  #   2. the BUILDER_REPO repository variable
  #      (Settings -> Secrets and variables -> Actions -> Variables)
  #   3. the production repo
  #
  # (2) is the one that matters for a fork: set it once on the test repo
  # and every workflow follows, with nothing to remember to revert.
  BUILDER_REPO: ${{ inputs.builder_repo || vars.BUILDER_REPO || 'https://github.com/DigitalNoteXDN/DigitalNote-Builder.git' }}
  JOBS: 4

jobs:
  # v2.0.0.9: Windows split into libs + build, matching every other platform.
  #
  # It was ONE job doing Qt6, the libraries, the daemon and the wallet.  That
  # meant a red mark could not distinguish "libraries broke" from "the wallet
  # broke" -- which is exactly what made the recent Windows failures harder to
  # read than the Linux ones -- and Windows could not parallelise its libs
  # against anything.
  #
  # Both jobs repeat the setup (checkout, MSYS2, Builder clone) because they run
  # on separate runners.  MSYS2 setup is ~1 min; the caches make the rest cheap.
  libs-windows-x64:
    name: Compile libraries — Windows x64 (MSYS2 MinGW64)
    runs-on: windows-2022
    timeout-minutes: 180

    defaults:
      run:
        shell: msys2 {0}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout DigitalNote-2
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          submodules: false

      # ── 2. MSYS2 MinGW64 ───────────────────────────────────────────────────
      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-double-conversion
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-libwinpthread
            mingw-w64-x86_64-md4c
            perl
            bzip2
            libtool
            make
            autoconf
            automake
            automake-wrapper
            pkg-config

      # ── 3. Clone DigitalNote-Builder ───────────────────────────────────────
      - name: Clone DigitalNote-Builder
        run: |
          # v2.0.0.9: the Builder lives OUTSIDE the MSYS2 home so that
          # actions/cache (which runs in Node context, where ~ is
          # C:\Users\runneradmin) and MSYS2 (where ~ is
          # D:\a\_temp\msys64\home\runneradmin) agree on one location.
          # They did NOT before, so every Windows cache silently failed:
          #   Path Validation Error: Path(s) specified in the action for
          #   caching do(es) not exist, hence no cache is being saved.
          BUILDER="$(cygpath -u '${{ runner.workspace }}')/DigitalNote-Builder"
          cd "$(dirname "$BUILDER")"
          if [ ! -d DigitalNote-Builder ]; then
            git clone ${{ env.BUILDER_REPO }}
          else
            cd DigitalNote-Builder && git pull origin master
          fi
          mkdir -p "$BUILDER"/windows/x64/temp
          mkdir -p "$BUILDER"/windows/x64/libs

      # -- 4. Qt6: built IN-JOB (no prebuilt release asset) ------------------
      #
      # v2.0.0.9: this previously ran `gh release download
      # qt-static-5.15.7-mingw64` against the Builder repo.  No Qt6 asset
      # exists, and keeping one in step with the source tree is its own
      # maintenance burden, so Qt6 is built here -- self-contained, and the
      # version tracks the Builder scripts rather than the last upload.
      #
      # ~20-25 min on a cache MISS only.  The key is pinned to the Qt version,
      # so bumping Qt invalidates it automatically.  Never reuse a key across
      # versions: a Qt5 tree restored into a Qt6 build fails at link with
      # errors that point nowhere near the cause.
      - name: Cache Qt 6.8.3 static build
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/DigitalNote-Builder/windows/x64/libs/qt-6.8.3
          key: qt-6.8.3-static-mingw64-v1

      - name: Download Qt6 sources
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          # v2.0.0.9: the Builder lives OUTSIDE the MSYS2 home so that
          # actions/cache (which runs in Node context, where ~ is
          # C:\Users\runneradmin) and MSYS2 (where ~ is
          # D:\a\_temp\msys64\home\runneradmin) agree on one location.
          # They did NOT before, so every Windows cache silently failed:
          #   Path Validation Error: Path(s) specified in the action for
          #   caching do(es) not exist, hence no cache is being saved.
          BUILDER="$(cygpath -u '${{ runner.workspace }}')/DigitalNote-Builder"
          mkdir -p "$BUILDER"/download
          cd "$BUILDER"/download
          wget -q https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qtbase-everywhere-src-6.8.3.tar.xz
          wget -q https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qttools-everywhere-src-6.8.3.tar.xz
          ls -lh qtbase-everywhere-src-6.8.3.tar.xz qttools-everywhere-src-6.8.3.tar.xz

      - name: Build static Qt6 (qtbase + qttools)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          # v2.0.0.9: the Builder lives OUTSIDE the MSYS2 home so that
          # actions/cache (which runs in Node context, where ~ is
          # C:\Users\runneradmin) and MSYS2 (where ~ is
          # D:\a\_temp\msys64\home\runneradmin) agree on one location.
          # They did NOT before, so every Windows cache silently failed:
          #   Path Validation Error: Path(s) specified in the action for
          #   caching do(es) not exist, hence no cache is being saved.
          BUILDER="$(cygpath -u '${{ runner.workspace }}')/DigitalNote-Builder"
          cd "$BUILDER"/windows/x64
          mkdir -p temp libs
          bash ../../compile/qt6.sh       "-G Ninja" "-j ${{ env.JOBS }}"
          bash ../../compile/qt6_tools.sh "-G Ninja" "-j ${{ env.JOBS }}"
          echo "Qt6 ready:"
          ls "$BUILDER"/windows/x64/libs/qt-6.8.3/bin/

      # ── 5. Cache compiled libraries ────────────────────────────────────────
      - name: Cache compiled libraries
        uses: actions/cache@v4
        id: libs-cache
        with:
          path: |
            ${{ runner.workspace }}/DigitalNote-Builder/windows/x64/libs/db-6.2.32.NC
            ${{ runner.workspace }}/DigitalNote-Builder/windows/x64/libs/boost_1_91_0
            ${{ runner.workspace }}/DigitalNote-Builder/windows/x64/libs/openssl-3.5.7
            ${{ runner.workspace }}/DigitalNote-Builder/windows/x64/libs/libevent-2.1.12-stable
            ${{ runner.workspace }}/DigitalNote-Builder/windows/x64/libs/miniupnpc-2.2.8
            ${{ runner.workspace }}/DigitalNote-Builder/windows/x64/libs/qrencode-4.1.1
          key: windows-x64-libs-v10-${{ hashFiles('DigitalNote_config.pri', 'include/libs.pri', 'include/libs/bip39.pri') }}

      # ── 6. Download source archives ────────────────────────────────────────
      - name: Download library source archives
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          # v2.0.0.9: the Builder lives OUTSIDE the MSYS2 home so that
          # actions/cache (which runs in Node context, where ~ is
          # C:\Users\runneradmin) and MSYS2 (where ~ is
          # D:\a\_temp\msys64\home\runneradmin) agree on one location.
          # They did NOT before, so every Windows cache silently failed:
          #   Path Validation Error: Path(s) specified in the action for
          #   caching do(es) not exist, hence no cache is being saved.
          BUILDER="$(cygpath -u '${{ runner.workspace }}')/DigitalNote-Builder"
          mkdir -p "$BUILDER"/download
          cd "$BUILDER"/download
          wget -q https://archives.boost.io/release/1.91.0/source/boost_1_91_0.tar.gz
          wget -q https://github.com/openssl/openssl/releases/download/openssl-3.5.7/openssl-3.5.7.tar.gz
          wget -q http://download.oracle.com/berkeley-db/db-6.2.32.NC.tar.gz
          wget -q https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz
          wget -q "http://miniupnp.free.fr/files/download.php?file=miniupnpc-2.2.8.tar.gz" \
            -O miniupnpc-2.2.8.tar.gz
          wget -q https://github.com/fukuchi/libqrencode/archive/refs/tags/v4.1.1.tar.gz
          echo "Downloads complete:"
          ls -lh "$BUILDER"/download/

      # ── 7. Compile static libraries ────────────────────────────────────────
      # BIP39 is now compiled directly into the wallet via bip39.pri
      # mnemonic.sh is no longer needed
      - name: Compile static libraries
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          # v2.0.0.9: the Builder lives OUTSIDE the MSYS2 home so that
          # actions/cache (which runs in Node context, where ~ is
          # C:\Users\runneradmin) and MSYS2 (where ~ is
          # D:\a\_temp\msys64\home\runneradmin) agree on one location.
          # They did NOT before, so every Windows cache silently failed:
          #   Path Validation Error: Path(s) specified in the action for
          #   caching do(es) not exist, hence no cache is being saved.
          BUILDER="$(cygpath -u '${{ runner.workspace }}')/DigitalNote-Builder"
          MSYS_WORKSPACE=$(cygpath -u '${{ github.workspace }}')
          mkdir -p "$BUILDER"/download
          ln -sfn "$MSYS_WORKSPACE" "$BUILDER"/windows/x64/DigitalNote-2

          cd "$BUILDER"/windows/x64
          export TARGET_OS=NATIVE_WINDOWS
          J="${{ env.JOBS }}"

          # v2.0.0.9: unchained from && and routed through bash.
          # set -e is suppressed inside an && list, so a failing build was
          # swallowed and the step still exited 0.  bash also removes the
          # dependency on an executable bit the Windows checkout does not keep.
          # v2.0.0.9: LevelDB and secp256k1 are NOT built here.
          #
          # Both are VENDORED -- compile/leveldb.sh and secp256k1.sh cd into
          # DigitalNote-2/src/... and build INSIDE THE CHECKOUT, producing
          # src/leveldb/libleveldb.a and src/secp256k1/.libs/libsecp256k1.a.
          #
          # This job has its own checkout; the build job has a different one on
          # a different runner, and the caches cover libs/ (external libraries)
          # only.  Building them here left the build job linking against files
          # that did not exist:
          #     ld: cannot find .../src/leveldb/libleveldb.a
          #
          # They now build in the BUILD job, next to the source they belong to.
          # Windows is the only platform that needs this: leveldb.pri builds
          # them via PRE_TARGETDEPS everywhere else and prints
          # "You need to compile leveldb yourself with msys2." on win32.
          echo "=== BerkeleyDB ==="
          bash ../../compile/berkeleydb.sh "build_windows" "--enable-mingw" "-j $J"
          echo "=== Boost ==="
          bash ../../compile/boost.sh "toolset=gcc address-model=64 -j $J"
          echo "=== GMP ===" && bash gmp.sh
          echo "=== libevent ==="
          bash ../../compile/libevent.sh "" "-j $J"
          echo "=== miniupnpc ==="
          bash ../../compile/miniupnpc.sh "libminiupnpc.a" "-j $J"
          echo "=== OpenSSL ==="
          bash ../../compile/openssl.sh "mingw64" "-j $J"
          echo "=== qrencode ==="
          bash ../../compile/qrencode.sh "" "-j $J"
          echo "=== All libraries built ==="

      # ── 8. Link source tree ────────────────────────────────────────────────

  build-and-test-windows-x64:
    name: Windows x64 — Build + Test (MSYS2 MinGW64)
    runs-on: windows-2022
    timeout-minutes: 90
    needs: libs-windows-x64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout DigitalNote-2
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          submodules: false

      # ── 2. MSYS2 MinGW64 ───────────────────────────────────────────────────
      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-double-conversion
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-libwinpthread
            mingw-w64-x86_64-md4c
            perl
            bzip2
            libtool
            make
            autoconf
            automake
            automake-wrapper
            pkg-config

      # ── 3. Clone DigitalNote-Builder ───────────────────────────────────────
      - name: Clone DigitalNote-Builder
        run: |
          # v2.0.0.9: the Builder lives OUTSIDE the MSYS2 home so that
          # actions/cache (which runs in Node context, where ~ is
          # C:\Users\runneradmin) and MSYS2 (where ~ is
          # D:\a\_temp\msys64\home\runneradmin) agree on one location.
          # They did NOT before, so every Windows cache silently failed:
          #   Path Validation Error: Path(s) specified in the action for
          #   caching do(es) not exist, hence no cache is being saved.
          BUILDER="$(cygpath -u '${{ runner.workspace }}')/DigitalNote-Builder"
          cd "$(dirname "$BUILDER")"
          if [ ! -d DigitalNote-Builder ]; then
            git clone ${{ env.BUILDER_REPO }}
          else
            cd DigitalNote-Builder && git pull origin master
          fi
          mkdir -p "$BUILDER"/windows/x64/temp
          mkdir -p "$BUILDER"/windows/x64/libs

      # -- 4. Qt6: built IN-JOB (no prebuilt release asset) ------------------
      #
      # v2.0.0.9: this previously ran `gh release download
      # qt-static-5.15.7-mingw64` against the Builder repo.  No Qt6 asset
      # exists, and keeping one in step with the source tree is its own
      # maintenance burden, so Qt6 is built here -- self-contained, and the
      # version tracks the Builder scripts rather than the last upload.
      #
      # ~20-25 min on a cache MISS only.  The key is pinned to the Qt version,
      # so bumping Qt invalidates it automatically.  Never reuse a key across
      # versions: a Qt5 tree restored into a Qt6 build fails at link with
      # errors that point nowhere near the cause.
      # Restore-only: the libs job built and saved these.  A miss here means
      # the libs job did not save, and the build below will fail on missing
      # headers rather than silently rebuilding.
      - name: Restore Qt 6.8.3 from cache
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.workspace }}/DigitalNote-Builder/windows/x64/libs/qt-6.8.3
          key: qt-6.8.3-static-mingw64-v1

      - name: Restore compiled libraries from cache
        uses: actions/cache/restore@v4
        id: libs-cache
        with:
          path: |
            ${{ runner.workspace }}/DigitalNote-Builder/windows/x64/libs/db-6.2.32.NC
            ${{ runner.workspace }}/DigitalNote-Builder/windows/x64/libs/boost_1_91_0
            ${{ runner.workspace }}/DigitalNote-Builder/windows/x64/libs/openssl-3.5.7
            ${{ runner.workspace }}/DigitalNote-Builder/windows/x64/libs/libevent-2.1.12-stable
            ${{ runner.workspace }}/DigitalNote-Builder/windows/x64/libs/miniupnpc-2.2.8
            ${{ runner.workspace }}/DigitalNote-Builder/windows/x64/libs/qrencode-4.1.1
          key: windows-x64-libs-v10-${{ hashFiles('DigitalNote_config.pri', 'include/libs.pri', 'include/libs/bip39.pri') }}

      # ── 6. Download source archives ────────────────────────────────────────
      - name: Link source tree into Builder
        run: |
          # v2.0.0.9: the Builder lives OUTSIDE the MSYS2 home so that
          # actions/cache (which runs in Node context, where ~ is
          # C:\Users\runneradmin) and MSYS2 (where ~ is
          # D:\a\_temp\msys64\home\runneradmin) agree on one location.
          # They did NOT before, so every Windows cache silently failed:
          #   Path Validation Error: Path(s) specified in the action for
          #   caching do(es) not exist, hence no cache is being saved.
          BUILDER="$(cygpath -u '${{ runner.workspace }}')/DigitalNote-Builder"
          MSYS_WORKSPACE=$(cygpath -u '${{ github.workspace }}')
          ln -sfn "$MSYS_WORKSPACE" "$BUILDER"/windows/x64/DigitalNote-2

      # ── 9. Compile daemon ──────────────────────────────────────────────────
      # NB: use mingw32-make, not make. qmake's win32 generator emits
      # Windows-style commands (del, copy, *.bat invocations) for things
      # like build.h regeneration. mingw32-make runs them via cmd.exe;
      # MSYS2 'make' runs them via /bin/sh, which has no 'del' and fails.
      # v2.0.0.9: vendored libs build HERE, not in the libs job.
      #
      # compile/leveldb.sh and secp256k1.sh cd into DigitalNote-2/src/... and
      # build inside the CHECKOUT.  The libs job has a different checkout on a
      # different runner and the caches cover libs/ only, so building them there
      # produced nothing this job could link against.
      #
      # Only Windows needs this step: leveldb.pri builds them via PRE_TARGETDEPS
      # on every other platform and tells win32 to compile them by hand.
      - name: Compile vendored libs (LevelDB + secp256k1)
        run: |
          BUILDER="$(cygpath -u '${{ runner.workspace }}')/DigitalNote-Builder"
          cd "$BUILDER"/windows/x64

          # REQUIRED.  leveldb's build_detect_platform falls back to `uname -s`,
          # which on MSYS2 MinGW64 returns MINGW64_NT-... -- not a case it knows.
          # It then prints "Unknown platform!", emits no source list, and `ar`
          # creates an EMPTY 8-byte libleveldb.a.  The link later fails with
          # hundreds of undefined leveldb:: symbols rather than a missing file,
          # which points nowhere near the cause.
          #
          # windows/x64/compile_libs.sh:18 exports this for the same reason.
          export TARGET_OS=NATIVE_WINDOWS

          echo "=== LevelDB ==="
          bash ../../compile/leveldb.sh "-j ${{ env.JOBS }}"
          echo "=== secp256k1 ==="
          bash ../../compile/secp256k1.sh "" "-j ${{ env.JOBS }}"
          echo "=== vendored libs built ==="
          # FAIL LOUDLY on an empty archive.
          #
          # "ar -rs libleveldb.a" with no objects succeeds and writes an 8-byte
          # archive (just the "!<arch>" header).  The build then gets all the
          # way to link before failing with hundreds of undefined leveldb::
          # symbols -- a diagnostic that points at txdb-leveldb.cpp rather than
          # at the library that was never built.  Catch it here instead.
          for a in DigitalNote-2/src/leveldb/libleveldb.a \
                   DigitalNote-2/src/leveldb/libmemenv.a \
                   DigitalNote-2/src/secp256k1/.libs/libsecp256k1.a
          do
            if [ ! -f "$a" ]; then
              echo "ERROR: $a was not produced."
              exit 1
            fi
            sz=$(stat -c %s "$a")
            n=$(ar t "$a" 2>/dev/null | wc -l)
            printf '    %-52s %9s bytes  %s members\n' "$a" "$sz" "$n"
            if [ "$n" -eq 0 ]; then
              echo "ERROR: $a contains no object files -- the build produced nothing."
              echo "       Check for 'Unknown platform!' above: leveldb needs"
              echo "       TARGET_OS=NATIVE_WINDOWS on MSYS2."
              exit 1
            fi
          done
      
      - name: Compile daemon (digitalnoted.exe)
        run: |
          # v2.0.0.9: the Builder lives OUTSIDE the MSYS2 home so that
          # actions/cache (which runs in Node context, where ~ is
          # C:\Users\runneradmin) and MSYS2 (where ~ is
          # D:\a\_temp\msys64\home\runneradmin) agree on one location.
          # They did NOT before, so every Windows cache silently failed:
          #   Path Validation Error: Path(s) specified in the action for
          #   caching do(es) not exist, hence no cache is being saved.
          BUILDER="$(cygpath -u '${{ runner.workspace }}')/DigitalNote-Builder"
          cd "$BUILDER"/windows/x64
          export PATH="$PWD/libs/qt-6.8.3/bin:$PATH"
          cd DigitalNote-2
          rm -rf build Makefile
          qmake DigitalNote.daemon.pro \
            USE_UPNP=1 \
            USE_BUILD_INFO=0 \
            \
            RELEASE=1
          mingw32-make -j${{ env.JOBS }} 2>&1 | tee ~/build-daemon.log
          exit ${PIPESTATUS[0]}

      # ── 10. Compile Qt wallet ──────────────────────────────────────────────
      # See note on step 9 — mingw32-make is required for Windows-style rules.
      - name: Compile Qt wallet (DigitalNote-qt.exe)
        run: |
          # v2.0.0.9: the Builder lives OUTSIDE the MSYS2 home so that
          # actions/cache (which runs in Node context, where ~ is
          # C:\Users\runneradmin) and MSYS2 (where ~ is
          # D:\a\_temp\msys64\home\runneradmin) agree on one location.
          # They did NOT before, so every Windows cache silently failed:
          #   Path Validation Error: Path(s) specified in the action for
          #   caching do(es) not exist, hence no cache is being saved.
          BUILDER="$(cygpath -u '${{ runner.workspace }}')/DigitalNote-Builder"
          cd "$BUILDER"/windows/x64
          export PATH="$PWD/libs/qt-6.8.3/bin:$PATH"
          cd DigitalNote-2
          rm -rf build Makefile
          qmake DigitalNote.app.pro \
            USE_UPNP=1 \
            USE_DBUS=1 \
            USE_QRCODE=1 \
            USE_BUILD_INFO=0 \
            \
            RELEASE=1
          mingw32-make -j${{ env.JOBS }} 2>&1 | tee ~/build-app.log
          exit ${PIPESTATUS[0]}

      # ── 11. Warning analysis ───────────────────────────────────────────────
      - name: Analyse build warnings
        if: always()
        run: |
          for log in ~/build-app.log ~/build-daemon.log; do
            if [ -f "$log" ]; then
              W=$(grep -c ": warning:" "$log" 2>/dev/null || echo 0)
              E=$(grep -c ": error:"   "$log" 2>/dev/null || echo 0)
              echo "=== $(basename $log): $W warning(s), $E error(s) ==="
              if [ "$W" -gt 0 ]; then
                grep ": warning:" "$log" \
                  | sed 's|.*: warning:||' | sort | uniq -c | sort -rn | head -20
              fi
            fi
          done

      # ── 12. cppcheck static analysis ──────────────────────────────────────
      - name: cppcheck — new Qt/BIP39 sources
        run: |
          pacman -S --noconfirm mingw-w64-x86_64-cppcheck 2>/dev/null || true
          WS=$(cygpath -u '${{ github.workspace }}')
          cppcheck \
            --enable=warning,style,performance \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --error-exitcode=0 \
            --std=c++17 \
            -I "$WS/src/bip39/include" \
            -I "$WS/src" \
            "$WS/src/qt/seedphrasedialog.cpp" \
            "$WS/src/qt/decryptworker.cpp" \
            "$WS/src/qt/walletmodel.cpp" \
            "$WS/src/qt/askpassphrasedialog.cpp" \
            "$WS/src/qt/coincontrolworker.cpp" \
            "$WS/src/qt/sendcoinsworker.cpp" \
            "$WS/src/qt/masternodeworker.cpp" \
            "$WS/src/bip39/src/bip39_wallet.cpp" \
            "$WS/src/bip39/src/bip39_passphrase.cpp" \
            "$WS/src/rpcbip39.cpp" \
            2>&1 || echo "⚠ cppcheck warnings present (non-fatal)"

      # ── 13. Version assertions ─────────────────────────────────────────────
      - name: Report version constants
        run: |
          # Extract the version constants from source and print them.
          # No assertion — if the source is wrong, the binary will be
          # wrong too, and that's a source-review problem, not a CI one.
          BUILD=$(grep -oE 'CLIENT_VERSION_BUILD[[:space:]]+[0-9]+' src/clientversion.h | awk '{print $NF}')
          PROTOCOL=$(grep -oE 'PROTOCOL_VERSION[[:space:]]*=[[:space:]]*[0-9]+' src/version.h | awk '{print $NF}')
          MIN_PEER=$(grep -oE 'MIN_PEER_PROTO_VERSION[[:space:]]*=[[:space:]]*[0-9]+' src/version.h | awk '{print $NF}')
          echo "Building with:"
          echo "  CLIENT_VERSION_BUILD = $BUILD"
          echo "  PROTOCOL_VERSION = $PROTOCOL"
          echo "  MIN_PEER_PROTO_VERSION = $MIN_PEER"
      - name: Assert daemon was built
        run: |
          BUILDER="$(cygpath -u '${{ runner.workspace }}')/DigitalNote-Builder"
          # NOTE: DigitalNoted has no --version flag — the source-header
          # checks above prove the build is at version 2.0.0.7. This step
          # is just a sanity check that the binary actually exists.
          # The build writes to MSYS2 home, not github.workspace — same
          # path the Collect step uses below.
          SRC="$BUILDER/windows/x64/DigitalNote-2"
          DAEMON=$(find "$SRC" -iname 'DigitalNoted.exe' -type f | head -1)
          if [ -z "$DAEMON" ]; then
            echo "ERROR: DigitalNoted.exe not found under $SRC"
            ls -la "$SRC" 2>/dev/null || echo "(directory does not exist)"
            exit 1
          fi
          echo "OK: DigitalNoted.exe built at $DAEMON"
          ls -lh "$DAEMON"

      # ── 14. Collect and upload binaries ───────────────────────────────────
      # NB: We run this step in MSYS2 bash, NOT pwsh, even though the rest of
      # collect-and-upload looks Windows-y. Reason: the build steps run under
      # MSYS2 and write to "$BUILDER"/... where ~ resolves to
      # D:\a\_temp\msys64\home\runneradmin\. PowerShell's $env:USERPROFILE
      # resolves to C:\Users\runneradmin\ — a completely different directory
      # that doesn't exist. Staying in MSYS2 bash here keeps paths consistent.
      # The 'cygpath -w' calls convert MSYS2 paths to Windows form for the
      # upload-artifact step that follows (which does run on the Windows
      # filesystem and needs backslash paths).
      - name: Collect Windows executables
        run: |
          BUILDER="$(cygpath -u '${{ runner.workspace }}')/DigitalNote-Builder"
          SRC="$BUILDER/windows/x64/DigitalNote-2"
          DST="$(cygpath -u '${{ github.workspace }}')/artifacts"
          mkdir -p "$DST"
          # Copy every .exe produced by either build (daemon + Qt wallet)
          find "$SRC" -name '*.exe' -type f -exec cp {} "$DST/" \;
          # Logs — written to ~/build-*.log by steps 9/10
          cp "$HOME/build-app.log"    "$DST/" 2>/dev/null || true
          cp "$HOME/build-daemon.log" "$DST/" 2>/dev/null || true
          echo "=== Collected artefacts ==="
          ls -lh "$DST/"

      - name: Upload Windows x64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: digitalnote-windows-x64
          path: ${{ github.workspace }}\artifacts\*.exe
          retention-days: 14

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-windows-x64-${{ github.sha }}
          path: ${{ github.workspace }}\artifacts\*.log
          retention-days: 14